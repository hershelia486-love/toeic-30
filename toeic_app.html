<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TOEIC 30 — 380에서 920으로</title>
<style>
  :root{
    --paper: #EDEAE1;
    --card: #F7F5EF;
    --ink: #1C2B44;
    --pencil: #5C594E;
    --pencil-light: #8A8677;
    --rule: #CFC8B8;
    --rule-strong: #A79F8A;
    --red: #A63D2F;
    --green: #3C6E58;
    --ochre: #B9822E;
    --serif: Georgia, 'Iowan Old Style', 'Nanum Myeongjo', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  button{
    -webkit-appearance:none;
    appearance:none;
    font-family:inherit;
    background-image:none;
    box-shadow:none;
  }
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--sans);}
  body{
    padding-bottom: 76px;
    min-height:100vh;
  }
  .wrap{max-width:480px; margin:0 auto; position:relative;}

  /* ---- Header: admission-ticket strip ---- */
  .ticket-header{
    background:var(--ink);
    color:var(--paper);
    padding:18px 20px 16px;
    position:relative;
    border-bottom: 3px double var(--ochre);
  }
  .ticket-header .top-row{
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .ticket-header .brand{
    font-family:var(--serif);
    font-size:20px;
    letter-spacing:0.5px;
  }
  .ticket-header .brand small{
    display:block;
    font-family:var(--sans);
    font-size:11px;
    color:#C7BFA8;
    margin-top:2px;
    letter-spacing:0.3px;
  }
  .ticket-header .day-count{
    font-family:var(--mono);
    font-size:22px;
    text-align:right;
  }
  .ticket-header .day-count .of{
    font-size:13px;
    color:#C7BFA8;
  }
  .progress-rule{
    margin-top:12px;
    height:3px;
    background:rgba(255,255,255,0.18);
    position:relative;
    overflow:hidden;
  }
  .progress-rule .fill{
    position:absolute; left:0; top:0; bottom:0;
    background:var(--ochre);
    width:0%;
    transition:width .3s ease;
  }

  main{padding:16px 16px 8px;}

  h2.section-title{
    font-family:var(--serif);
    font-size:19px;
    margin:4px 0 14px;
    color:var(--ink);
    border-bottom:1px solid var(--rule);
    padding-bottom:8px;
  }

  /* ---- Day grid (schedule) ---- */
  .day-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:8px;
    margin-bottom:20px;
  }
  .day-tile{
    aspect-ratio:1;
    background:var(--card);
    border:1px solid var(--rule);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    cursor:pointer;
    position:relative;
  }
  .day-tile .num{font-size:15px; font-weight:600;}
  .day-tile .tag{font-size:8px; font-family:var(--sans); color:var(--pencil-light); margin-top:2px;}
  .day-tile.done{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .day-tile.done .tag{color:#C7BFA8;}
  .day-tile.today{border:2px solid var(--ochre);}
  .day-tile.review{border-style:dashed;}
  .day-tile.exam{border-color:var(--red);}
  .day-tile:active{opacity:0.7;}

  .start-prompt{
    background:var(--card);
    border:1px solid var(--rule);
    padding:24px 18px;
    text-align:center;
    margin-bottom:20px;
  }
  .start-prompt p{color:var(--pencil); font-size:14px; line-height:1.6; margin:0 0 16px;}

  /* ---- Buttons ---- */
  .btn{
    display:inline-block;
    font-family:var(--sans);
    font-size:14px;
    font-weight:700;
    padding:12px 20px;
    background:#2255C7 !important;
    color:#FFFFFF !important;
    background-image:none !important;
    box-shadow:none !important;
    text-shadow:none !important;
    border:none !important;
    -webkit-appearance:none !important;
    appearance:none !important;
    cursor:pointer;
    text-align:center;
    -webkit-text-fill-color:#FFFFFF;
  }
  .btn:active{opacity:0.75;}
  .btn.outline{background:#FFFFFF !important; color:#2255C7 !important; border:2px solid #2255C7 !important; -webkit-text-fill-color:#2255C7;}
  .btn.outline.red{color:#C0392B !important; border-color:#C0392B !important;}
  .btn.red{background:#C0392B !important; color:#FFFFFF !important; -webkit-text-fill-color:#FFFFFF;}
  .btn.green{background:#1E8A5F !important; color:#FFFFFF !important; -webkit-text-fill-color:#FFFFFF;}
  .btn.block{display:block; width:100%;}
  .btn.small{padding:8px 12px; font-size:12.5px;}
  .btn:disabled{opacity:0.4; cursor:default;}

  /* ---- Card / section blocks ---- */
  .block{
    background:var(--card);
    border:1px solid var(--rule);
    padding:16px;
    margin-bottom:14px;
  }
  .block .label{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:1px;
    color:var(--pencil-light);
    margin-bottom:8px;
    text-transform:uppercase;
  }
  .theme-line{font-family:var(--serif); font-size:17px; margin-bottom:2px;}
  .grammar-line{font-size:12.5px; color:var(--red);}

  /* ---- Vocab card ---- */
  .vocab-item{
    border-bottom:1px solid var(--rule);
    padding:12px 0;
  }
  .vocab-item:last-child{border-bottom:none;}
  .vocab-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .vocab-word{font-family:var(--serif); font-size:17px; font-weight:700;}
  .vocab-pos{font-size:11px; color:var(--pencil-light); font-style:italic;}
  .vocab-meaning{font-size:14px; color:var(--ink); margin-left:auto;}
  .vocab-colloc{font-size:12.5px; color:var(--green); margin-top:4px;}
  .vocab-tip{font-size:12.5px; color:var(--ochre); margin-top:3px;}
  .vocab-example{font-size:12.5px; color:var(--pencil); margin-top:4px; font-style:italic;}
  .vocab-mark{display:flex; gap:6px; margin-top:8px;}

  /* ---- Flashcard (vocab study screen) ---- */
  .flashcard{
    background:var(--card);
    border:1px solid var(--rule);
    min-height:220px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px 18px;
    cursor:pointer;
    position:relative;
  }
  .flashcard .fc-word{font-family:var(--serif); font-size:30px; font-weight:700;}
  .flashcard .fc-pos{font-size:12px; color:var(--pencil-light); margin-top:4px;}
  .flashcard .fc-hint{font-size:11px; color:var(--pencil-light); position:absolute; bottom:10px;}
  .flashcard .fc-back{display:none; width:100%;}
  .flashcard.flipped .fc-front{display:none;}
  .flashcard.flipped .fc-back{display:block;}
  .fc-meaning{font-size:20px; font-weight:700; margin-bottom:10px;}
  .fc-colloc{font-size:14px; color:var(--green); margin-bottom:6px;}
  .fc-tip{font-size:13px; color:var(--ochre); margin-bottom:6px; line-height:1.5;}
  .fc-example{font-size:13px; color:var(--pencil); font-style:italic;}
  .fc-controls{display:flex; gap:10px; margin-top:16px;}
  .fc-progress{text-align:center; font-family:var(--mono); font-size:12px; color:var(--pencil-light); margin-bottom:10px;}

  /* ---- Questions ---- */
  .q-block{margin-bottom:16px;}
  .q-script{
    font-size:13.5px;
    line-height:1.7;
    white-space:pre-line;
    background:var(--paper);
    border-left:3px solid var(--rule-strong);
    padding:10px 12px;
    margin-bottom:10px;
    color:var(--ink);
  }
  .q-passage{
    font-size:13.5px;
    line-height:1.7;
    background:var(--paper);
    border-left:3px solid var(--rule-strong);
    padding:10px 12px;
    margin-bottom:10px;
  }
  .q-sentence{font-size:14px; margin-bottom:10px; line-height:1.6;}
  .q-text{font-size:14px; font-weight:600; margin-bottom:8px;}
  .choices{display:flex; flex-direction:column; gap:6px;}
  .choice{
    border:1px solid var(--rule);
    padding:9px 12px;
    font-size:13.5px;
    cursor:pointer;
    background:var(--card);
  }
  .choice:active{background:var(--paper);}
  .choice.correct{border-color:var(--green); background:#E7F0EA; color:var(--green); font-weight:600;}
  .choice.wrong{border-color:var(--red); background:#F5E7E4; color:var(--red); font-weight:600;}
  .choice.disabled{pointer-events:none;}
  .q-explain{
    margin-top:8px;
    font-size:12.5px;
    color:var(--pencil);
    background:var(--paper);
    padding:8px 10px;
    border-left:2px solid var(--ochre);
    display:none;
  }
  .q-explain.show{display:block;}
  .save-mistake-btn{margin-top:8px;}

  /* ---- Timer (mock exam) ---- */
  .timer-display{
    text-align:center;
    padding:30px 10px;
    background:var(--ink);
    color:var(--paper);
    margin-bottom:16px;
  }
  .timer-display .phase{font-size:12px; color:#C7BFA8; letter-spacing:1px;}
  .timer-display .time{font-family:var(--mono); font-size:52px; margin:8px 0;}
  .timer-display .time.warn{color:#E8B4A8;}

  /* ---- Mistake notebook ---- */
  .filter-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .filter-chip{
    font-size:11.5px;
    padding:5px 10px;
    border:1px solid var(--rule-strong);
    color:var(--pencil);
    cursor:pointer;
    background:var(--card);
  }
  .filter-chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .mistake-card{
    background:var(--card);
    border:1px solid var(--rule);
    padding:12px 14px;
    margin-bottom:10px;
  }
  .mistake-grid{
    display:grid;
    grid-template-columns:auto 1fr;
    row-gap:6px; column-gap:10px;
    font-size:12.5px;
  }
  .mistake-grid dt{color:var(--pencil-light); font-family:var(--mono); font-size:10px; text-transform:uppercase; align-self:start; padding-top:1px;}
  .mistake-grid dd{margin:0; color:var(--ink); line-height:1.5;}
  .mistake-type-tag{
    display:inline-block;
    font-size:10.5px;
    background:var(--ochre);
    color:#fff;
    padding:2px 7px;
  }
  .top-types{
    background:var(--card);
    border:1px solid var(--rule);
    padding:14px;
    margin-bottom:16px;
  }
  .top-types .label{margin-bottom:10px;}
  .top-type-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; border-bottom:1px solid var(--rule);}
  .top-type-row:last-child{border-bottom:none;}
  .top-type-row .count{font-family:var(--mono); color:var(--red);}

  .empty-state{
    text-align:center;
    color:var(--pencil-light);
    font-size:13.5px;
    padding:40px 16px;
    line-height:1.6;
  }

  /* ---- Bottom nav ---- */
  .bottom-nav{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--ink);
    display:flex;
    max-width:480px;
    margin:0 auto;
    border-top:1px solid #33456A;
  }
  .nav-btn{
    flex:1;
    text-align:center;
    padding:11px 4px 9px;
    color:#9AA6BE;
    font-size:11px;
    background:none;
    border:none;
    font-family:var(--sans);
    cursor:pointer;
  }
  .nav-btn .icon{display:block; font-size:18px; margin-bottom:3px;}
  .nav-btn.active{color:var(--paper);}
  .nav-btn.active .icon{color:var(--ochre);}

  .day-detail-back{
    font-size:13px; color:var(--pencil); margin-bottom:12px; cursor:pointer; display:inline-block;
  }

  select, input[type=date]{
    font-family:var(--sans);
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--rule-strong);
    background:var(--card);
    color:var(--ink);
    width:100%;
    margin-bottom:10px;
  }
  textarea{
    font-family:var(--sans);
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--rule-strong);
    background:#fff;
    color:var(--ink);
    width:100%;
    resize:vertical;
    min-height:50px;
  }
  label.form-label{font-size:11.5px; color:var(--pencil-light); display:block; margin-bottom:4px; text-transform:uppercase; font-family:var(--mono);}
  .form-group{margin-bottom:12px;}

  .speak-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px; height:26px;
    border:1px solid var(--rule-strong);
    background:var(--paper);
    color:var(--ink);
    font-size:13px;
    cursor:pointer;
    flex-shrink:0;
    -webkit-appearance:none;
    appearance:none;
    padding:0;
  }
  .speak-btn:active{background:var(--ochre); color:#fff; border-color:var(--ochre);}
  .speak-row{display:flex; align-items:center; gap:8px;}
  .speak-inline{margin-left:6px;}

  .part-divider{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:1.5px;
    color:var(--pencil-light);
    text-transform:uppercase;
    margin:20px 0 10px;
    border-bottom:1px solid var(--rule);
    padding-bottom:4px;
  }
</style>
</head>
<body>
<noscript>
  <div style="max-width:480px;margin:40px auto;padding:24px;background:#F7F5EF;border:2px solid #A63D2F;color:#1C2B44;font-family:-apple-system,sans-serif;text-align:center;line-height:1.7;">
    <div style="font-size:18px;font-weight:700;margin-bottom:10px;">⚠️ 미리보기 화면입니다</div>
    <div style="font-size:14px;">
      지금 이 화면은 자바스크립트가 꺼진 미리보기예요.<br>
      오른쪽 위 공유(⬆️) 버튼을 눌러<br>
      <b>"Safari로 열기"</b>를 선택해주세요.
    </div>
  </div>
</noscript>
<div class="wrap">

  <div class="ticket-header">
    <div class="top-row">
      <div class="brand">TOEIC 30<small>380 → 920 독학 프로젝트</small></div>
      <div class="day-count" id="hdrDayCount">–<span class="of"> / 30</span></div>
    </div>
    <div class="progress-rule"><div class="fill" id="hdrProgress"></div></div>
  </div>

  <main id="app"></main>

  <nav class="bottom-nav">
    <button class="nav-btn" data-tab="schedule"><span class="icon">▦</span>스케줄</button>
    <button class="nav-btn" data-tab="exam"><span class="icon">◷</span>모의고사</button>
    <button class="nav-btn" data-tab="mistakes"><span class="icon">✕</span>오답노트</button>
    <button class="nav-btn" data-tab="vocab"><span class="icon">◆</span>단어</button>
  </nav>

</div>

<script>

t(명사화) → 할당된 것", "example": "He finished the assignment ahead of schedule."}, {"word": "cooperate", "pos": "v.", "meaning": "협력하다", "collocation": "cooperate with a team", "memory_tip": "co(함께)+operate(작동하다) → 함께 작동하다", "example": "Both teams cooperated to finish the project."}, {"word": "productivity", "pos": "n.", "meaning": "생산성", "collocation": "improve productivity", "memory_tip": "produce(생산)+tivity(명사화) → 생산해내는 능력", "example": "New tools boosted overall productivity."}, {"word": "priority", "pos": "n.", "meaning": "우선순위", "collocation": "top priority / set priorities", "memory_tip": "prior(앞선)+ity(명사화) → 앞에 두는 것", "example": "Customer satisfaction is our top priority."}, {"word": "delegate", "pos": "v.", "meaning": "위임하다", "collocation": "delegate a task", "memory_tip": "de(아래로)+leg(보내다) → 아래로 일을 보내다", "example": "Good managers delegate tasks effectively."}, {"word": "streamline", "pos": "v.", "meaning": "간소화하다", "collocation": "streamline a process", "memory_tip": "stream(흐름)+line(선) → 흐름을 매끄러운 선으로", "example": "The new software streamlined our workflow."}, {"word": "outcome", "pos": "n.", "meaning": "결과", "collocation": "a positive/desired outcome", "memory_tip": "out(밖으로)+come(나오다) → 밖으로 나온 결과", "example": "The meeting produced a positive outcome."}, {"word": "correspond", "pos": "v.", "meaning": "일치하다, 상응하다", "collocation": "correspond with a record", "memory_tip": "cor(함께)+respond(응답하다) → 서로 맞아떨어짐", "example": "The invoice numbers correspond with the shipment."}, {"word": "coordinate", "pos": "v.", "meaning": "조율하다", "collocation": "coordinate a schedule", "memory_tip": "co(함께)+ordinate(정렬하다) → 함께 정리함", "example": "She coordinates schedules for the whole team."}, {"word": "designate", "pos": "v.", "meaning": "지정하다", "collocation": "designate a leader", "memory_tip": "de(강조)+sign(표시하다) → 확실히 표시해 정함", "example": "He was designated as the project lead."}, {"word": "consolidate", "pos": "v.", "meaning": "통합하다", "collocation": "consolidate reports", "memory_t : "n.", "meaning": "관할권", "collocation": "within the jurisdiction", "memory_tip": "juris(법)+diction(말하다) → 법을 말할 수 있는 범위", "example": "This falls under state jurisdiction."}, {"word": "binding", "pos": "adj.", "meaning": "구속력 있는", "collocation": "a legally binding agreement", "memory_tip": "bind(묶다)+ing → 묶어놓는=구속하는", "example": "The agreement is legally binding."}, {"word": "draft", "pos": "n./v.", "meaning": "초안(을 작성하다)", "collocation": "draft a contract", "memory_tip": "draw(그리다)와 관련 → 초벌로 그려본 것", "example": "The lawyer drafted the new contract."}, {"word": "stipulate", "pos": "v.", "meaning": "명시하다", "collocation": "the contract stipulates that", "memory_tip": "stipul(짚) → 짚을 꺾어 계약한 관습에서 유래, 명확히 정함", "example": "The contract stipulates a 30-day notice period."}, {"word": "party", "pos": "n.", "meaning": "(계약) 당사자", "collocation": "the contracting party", "memory_tip": "일상 'party'와 달리 법률 문서에서 '당사자'로 쓰임", "example": "Both parties agreed to the terms."}, {"word": "arbitration", "pos": "n.", "meaning": "중재", "collocation": "settle by arbitration", "memory_tip": "arbiter(중재자)+ation", "example": "Disputes will be settled through arbitration."}, {"word": "confidentiality", "pos": "n.", "meaning": "기밀유지", "collocation": "a confidentiality agreement", "memory_tip": "confidential(기밀의)+ity", "example": "The NDA ensures confidentiality."}, {"word": "indemnify", "pos": "v.", "meaning": "배상하다, 보상하다", "collocation": "indemnify a party", "memory_tip": "in(부정)+damn(손해) → 손해를 없애줌", "example": "The vendor agreed to indemnify the client."}, {"word": "void", "pos": "adj.", "meaning": "무효인", "collocation": "declare void", "memory_tip": "vac(비다)와 관련 → 효력이 빈 상태", "example": "The contract was declared void."}, {"word": "renewal", "pos": "n.", "meaning": "갱신", "collocation": "an automatic renewal", "memory_tip": "renew(갱신하다)+al", "example": "The lease includes an automatic renewal clause."}, {"word": "counterpart", "pos": "n.", "meaning": "상대방, 대응자", "collocation": "our counterpart", "mem evious 30 days. This change takes effect immediately.", "questions": [{"q": "What was changed in the contract?", "choices": ["The price", "The notice period", "The service provider", "The payment method"], "answer": "The notice period", "paraphrase_note": "지문의 '45 days' written notice... instead of the previous 30 days' → 선지의 'the notice period'로 요약 패러프레이징"}, {"q": "How much notice is now required?", "choices": ["15 days", "30 days", "45 days", "60 days"], "answer": "45 days", "paraphrase_note": "지문의 숫자를 정확히 읽어야 하는 세부사항 확인 유형 (오답 함정: 30일은 '이전' 조건)"}]}}, "day06": {"theme": "인사/채용", "grammar_point": "동사 시제 - 현재완료/과거완료", "vocab": [{"word": "applicant", "pos": "n.", "meaning": "지원자", "collocation": "a qualified applicant", "memory_tip": "apply(지원하다)+ant(사람) → 지원하는 사람", "example": "Over 200 applicants applied for the job."}, {"word": "candidate", "pos": "n.", "meaning": "후보자", "collocation": "a strong candidate", "memory_tip": "candid(하얀, 순수한) → 로마시대 흰 옷 입은 후보에서 유래", "example": "She is a strong candidate for the position."}, {"word": "resume", "pos": "n.", "meaning": "이력서", "collocation": "submit a resume", "memory_tip": "re(다시)+sume(요약하다) → 경력을 요약함", "example": "Please attach your resume to the email."}, {"word": "qualification", "pos": "n.", "meaning": "자격", "collocation": "meet the qualifications", "memory_tip": "qualify(자격을 얻다)+cation", "example": "The job requires a degree qualification."}, {"word": "recruit", "pos": "v.", "meaning": "채용하다", "collocation": "recruit new staff", "memory_tip": "re(다시)+cruit(자라다) → 새 인력을 키워 채용", "example": "The company plans to recruit ten engineers."}, {"word": "vacancy", "pos": "n.", "meaning": "공석", "collocation": "fill a vacancy", "memory_tip": "vacant(비어있는)+cy", "example": "There is a vacancy in the sales department."}, {"word": "promotion", "pos": "n.", "meaning": "승진", "collocation": "receive a promotion", "memory_tip": "pro(앞으로)+mote(움직이다) → 앞으로 나아가게 함", "example": "He received a promotion last month."}, {"word": "probation", "p ence": "The company ___ over 200 resumes since posting the job last week.", "choices": ["receives", "received", "has received", "will receive"], "answer": "has received", "grammar_point": "동사시제: since+과거시점 → 현재완료(계속/경험)"}, {"sentence": "By the time the interview began, the candidate ___ her portfolio.", "choices": ["prepares", "prepared", "had prepared", "will prepare"], "answer": "had prepared", "grammar_point": "동사시제: By the time+과거시제절 → 과거완료(대과거)"}, {"sentence": "She ___ with the company for ten years before her promotion.", "choices": ["works", "worked", "had worked", "works"], "answer": "had worked", "grammar_point": "동사시제: before+과거 사건 → 과거완료"}], "part7": {"passage": "Job Posting: Marketing Assistant. We are seeking a qualified candidate with at least two years of experience. Interested applicants should submit a resume and cover letter by September 30. Selected candidates will undergo a three-month probation period.", "questions": [{"q": "What is required to apply?", "choices": ["A degree only", "A resume and cover letter", "A reference letter", "A portfolio"], "answer": "A resume and cover letter", "paraphrase_note": "지문 'submit a resume and cover letter'가 선지에 그대로 반복 - 직접 매칭형"}, {"q": "What happens after being selected?", "choices": ["Immediate promotion", "A probation period", "Relocation", "A salary review"], "answer": "A probation period", "paraphrase_note": "지문의 'undergo a three-month probation period' → 선지의 'A probation period'로 축약"}]}}, "day07": {"theme": "마케팅/광고", "grammar_point": "수동태", "vocab": [{"word": "campaign", "pos": "n.", "meaning": "캠페인", "collocation": "launch a campaign", "memory_tip": "camp(들판)에서의 군사작전 → 조직적 활동", "example": "The ad campaign launches next month."}, {"word": "target audience", "pos": "n.", "meaning": "목표 고객", "collocation": "reach the target audience", "memory_tip": "target(과녁)+audience(청중) → 겨냥하는 청중", "example": "Our target audience is young professionals."}, {"word": "brand awareness", "pos": "n.", "meaning": "브랜드 인지도", " ": "budget surplus", "memory_tip": "sur(위로)+plus(더함) → 남아도는 만큼 더함", "example": "The company reported a budget surplus."}, {"word": "deficit", "pos": "n.", "meaning": "적자", "collocation": "run a deficit", "memory_tip": "de(부족)+fic(만들다) → 부족하게 만들어진 것", "example": "The department is running a deficit."}, {"word": "reimburse", "pos": "v.", "meaning": "환급하다, 상환하다", "collocation": "reimburse expenses", "memory_tip": "re(다시)+im+burse(지갑) → 지갑으로 돈을 되돌려줌", "example": "The company will reimburse your travel costs."}, {"word": "allocate", "pos": "v.", "meaning": "배정하다", "collocation": "allocate funds", "memory_tip": "al(~에)+locate(위치시키다) → 자리를 정해 나눠줌", "example": "Funds were allocated to each department."}, {"word": "overhead", "pos": "n.", "meaning": "간접비, 운영비", "collocation": "reduce overhead", "memory_tip": "over(위)+head → 머리 위에 얹힌 고정비용", "example": "The company cut overhead costs significantly."}, {"word": "depreciation", "pos": "n.", "meaning": "감가상각", "collocation": "calculate depreciation", "memory_tip": "de(아래로)+preci(가치)+ation → 가치가 아래로 떨어짐", "example": "Depreciation is calculated annually."}, {"word": "solvent", "pos": "adj.", "meaning": "지불능력이 있는", "collocation": "remain solvent", "memory_tip": "solve(풀다)와 어원 관련 → 빚을 풀 수 있는", "example": "The firm remained solvent despite the crisis."}, {"word": "quarterly", "pos": "adj./adv.", "meaning": "분기별의(로)", "collocation": "a quarterly report", "memory_tip": "quarter(1/4)+ly → 4분의 1마다", "example": "We review finances on a quarterly basis."}, {"word": "balance sheet", "pos": "n.", "meaning": "대차대조표", "collocation": "review the balance sheet", "memory_tip": "balance(균형)+sheet(표)", "example": "The balance sheet shows total assets."}, {"word": "cash flow", "pos": "n.", "meaning": "현금 흐름", "collocation": "positive cash flow", "memory_tip": "cash(현금)+flow(흐름)", "example": "The company maintains strong cash flow."}, {"word": "liquidity", "pos": "n.", "meaning": "유동성", "collocation": "financial liquidity", "memory_tip": "liquid(유동적인) ess program", "memory_tip": "well(건강한)+ness", "example": "The company started a wellness program."}, {"word": "eligible", "pos": "adj.", "meaning": "자격이 있는", "collocation": "eligible for benefits", "memory_tip": "e(밖으로)+lig(선택하다) → 선택될 자격이 있는", "example": "Full-time staff are eligible for benefits."}, {"word": "coverage", "pos": "n.", "meaning": "보장 범위", "collocation": "full coverage", "memory_tip": "cover(보장하다)+age", "example": "The insurance offers full coverage."}, {"word": "claim", "pos": "n./v.", "meaning": "청구(하다)", "collocation": "file a claim", "memory_tip": "clam(외치다)와 관련 → 권리를 소리내어 주장", "example": "She filed an insurance claim."}, {"word": "enroll", "pos": "v.", "meaning": "등록하다, 가입하다", "collocation": "enroll in a program", "memory_tip": "en(만들다)+roll(명부) → 명부에 이름을 올리다", "example": "New employees enroll in benefits."}, {"word": "premium", "pos": "n.", "meaning": "보험료", "collocation": "monthly premium", "memory_tip": "Day16 복습: premium=웃돈", "example": "The premium increased slightly this year."}, {"word": "deductible", "pos": "n.", "meaning": "자기부담금", "collocation": "pay the deductible", "memory_tip": "deduct(공제하다)+ible → 먼저 공제되는 금액", "example": "You must pay the deductible before coverage begins."}, {"word": "dependent", "pos": "n.", "meaning": "부양가족", "collocation": "add a dependent", "memory_tip": "depend(의존하다)+ent → 의존하는 사람", "example": "You can add a dependent to your plan."}, {"word": "checkup", "pos": "n.", "meaning": "건강검진", "collocation": "an annual checkup", "memory_tip": "check(확인하다)+up", "example": "Employees receive a free annual checkup."}, {"word": "prescription", "pos": "n.", "meaning": "처방전", "collocation": "fill a prescription", "memory_tip": "pre(미리)+script(쓰다) → 미리 써준 것", "example": "The prescription is covered by insurance."}, {"word": "reimbursement", "pos": "n.", "meaning": "환급, 상환", "collocation": "request reimbursement", "memory_tip": "Day8 복습: re+im+burse(지갑)", "example": "Submit receipts for reimbursement."}, {"word": "wellbeing", ong does claim processing take?", "choices": ["1 day", "5 business days", "2 weeks", "1 month"], "answer": "5 business days", "paraphrase_note": "지문의 'processed within five business days'가 선지에 그대로 반복"}]}}, "day19": {"theme": "환경/지속가능성", "grammar_point": "비교급/최상급", "vocab": [{"word": "sustainable", "pos": "adj.", "meaning": "지속 가능한", "collocation": "sustainable packaging", "memory_tip": "sus(아래에서)+tain(유지하다) → 계속 유지할 수 있는", "example": "We use sustainable packaging."}, {"word": "emission", "pos": "n.", "meaning": "배출", "collocation": "reduce emissions", "memory_tip": "e(밖으로)+mit(보내다) → 밖으로 내보냄", "example": "The factory reduced carbon emissions."}, {"word": "recycle", "pos": "v.", "meaning": "재활용하다", "collocation": "recycle materials", "memory_tip": "re(다시)+cycle(순환) → 다시 순환시킴", "example": "Please recycle all paper products."}, {"word": "eco-friendly", "pos": "adj.", "meaning": "친환경적인", "collocation": "eco-friendly products", "memory_tip": "eco(생태)+friendly(친화적인)", "example": "The new product line is eco-friendly."}, {"word": "renewable", "pos": "adj.", "meaning": "재생 가능한", "collocation": "renewable energy", "memory_tip": "re(다시)+new(새로운)+able", "example": "They invested in renewable energy."}, {"word": "regulation", "pos": "n.", "meaning": "규정", "collocation": "environmental regulation", "memory_tip": "regulate(규제하다)+ion", "example": "New environmental regulations apply."}, {"word": "waste", "pos": "n.", "meaning": "폐기물", "collocation": "reduce waste", "memory_tip": "waste=낭비, 버려지는 것", "example": "The plant reduced waste by 30 percent."}, {"word": "initiative", "pos": "n.", "meaning": "계획, 이니셔티브", "collocation": "a green initiative", "memory_tip": "initiate(시작하다)+ive → 시작하는 계획", "example": "The green initiative starts next year."}, {"word": "carbon footprint", "pos": "n.", "meaning": "탄소 발자국", "collocation": "reduce a carbon footprint", "memory_tip": "carbon(탄소)+footprint(발자국) → 남긴 흔적", "example": "The company aims to lower its carbon footprint."}, {"word": "biodegradable", "pos": "adj.", "meaning": "생분해성의", "collocation": "biodegradable packaging", "memory_tip": "bio(생물)+degrade(분해되다)+able", "example": "The packaging is fully biodegradable."}, {"word": "conservation", "pos": "n.", "meaning": "보존", "collocation": "energy conservation", "memory_tip": "conserve(보존하다)+ation", "example": "Energy conservation is a company priority."}, {"word": "greenhouse gas", "pos": "n.", "meaning": "온실가스", "collocation": "reduce greenhouse gas", "memory_tip": "greenhouse(온실)+gas", "example": "Greenhouse gas levels decreased this year."}, {"word": "pollutant", "pos": "n.", "meaning": "오염물질", "collocation": "reduce pollutants", "memory_tip": "pollute(오염시키다)+ant", "example": "New filters remove harmful pollutants."}, {"word": "solar panel", "pos": "n.", "meaning": "태양광 패널", "collocation": "install solar panels", "memory_tip": "solar(태양의)+panel(판)", "example": "Solar panels were installed on the roof."}, {"word": "compliance", "pos": "n.", "meaning": "준수", "collocation": "environmental compliance", "memory_tip": "comply(준수하다)+ance", "example": "The factory ensures full compliance."}, {"word": "footprint", "pos": "n.", "meaning": "(환경) 영향, 흔적", "collocation": "reduce its footprint", "memory_tip": "foot(발)+print(자국)", "example": "The company reduced its environmental footprint."}, {"word": "circular economy", "pos": "n.", "meaning": "순환 경제", "collocation": "promote a circular economy", "memory_tip": "circular(순환하는)+economy(경제)", "example": "The firm promotes a circular economy model."}, {"word": "carbon-neutral", "pos": "adj.", "meaning": "탄소 중립의", "collocation": "become carbon-neutral", "memory_tip": "carbon(탄소)+neutral(중립의)", "example": "The company aims to become carbon-neutral by 2030."}, {"word": "green certification", "pos": "n.", "meaning": "친환경 인증", "collocation": "earn green certification", "memory_tip": "green(친환경의)+certification(인증)", "example": "The building earned green certification."}, {"word": "environmental impact", "pos": "n.", "meaning": "환경 영향", "collocation": "assess environmental impact", "memory_tip": "environmental(환경의)+impact(영향)", "example": "They assessed the project's environmental impact."}, {"word": "biodiversity", "pos": "n.", "meaning": "생물다양성", "collocation": "protect biodiversity", "memory_tip": "bio(생물)+diversity(다양성)", "example": "The initiative aims to protect biodiversity."}, {"word": "single-use plastic", "pos": "n.", "meaning": "일회용 플라스틱", "collocation": "ban single-use plastic", "memory_tip": "single-use(일회용의)+plastic", "example": "The office banned single-use plastic."}, {"word": "carbon offset", "pos": "n.", "meaning": "탄소 상쇄", "collocation": "purchase carbon offsets", "memory_tip": "carbon(탄소)+offset(상쇄하다)", "example": "The airline offers carbon offset options."}, {"word": "clean energy", "pos": "n.", "meaning": "청정 에너지", "collocation": "invest in clean energy", "memory_tip": "clean(깨끗한)+energy(에너지)", "example": "The government invested in clean energy."}, {"word": "ecosystem", "pos": "n.", "meaning": "생태계", "collocation": "protect the local ecosystem", "memory_tip": "eco(생태)+system(체계)", "example": "The project protects the local ecosystem."}], "lc_dialogue": {"script": "A: Have you heard about our new sustainability initiative?\nB: Yes, we're switching to eco-friendly packaging.\nA: Will that reduce our carbon emissions too?\nB: Definitely, and we're also investing in renewable energy.", "questions": [{"q": "What is the company switching to?", "choices": ["Cheaper materials", "Eco-friendly packaging", "New suppliers", "Faster shipping"], "answer": "Eco-friendly packaging"}, {"q": "What else is the company investing in?", "choices": ["New offices", "Renewable energy", "More staff", "New regulations"], "answer": "Renewable energy"}]}, "part5": [{"sentence": "The new packaging is ___ eco-friendly than the previous version.", "choices": ["more", "most", "much", "very"], "answer": "more", "grammar_point": "비교급: than이 있으면 비교급(more+형용사)"}, {"sentence": "Solar energy is one of the ___ renewable resources available today.", "choices": ["cleaner", "cleanest", "clean", "more clean"], "answer": "cleanest", "grammar_point": "최상급: one of the + 최상급 + 복수명사"}, {"sentence": "This factory produces ___ emissions than any other in the region.", "choices": ["few", "fewer", "fewest", "less"], "answer": "fewer", "grammar_point": "비교급: emissions(가산명사 복수)+than → fewer 사용 (less는 불가산명사용)"}], "part7": {"passage": "Sustainability Report: This year, our company reduced waste by 30 percent and switched entirely to recyclable packaging. We also launched an initiative to use renewable energy in all factories by next year, in line with new regulations.", "questions": [{"q": "By how much was waste reduced?", "choices": ["10 percent", "20 percent", "30 percent", "50 percent"], "answer": "30 percent", "paraphrase_note": "지문의 'reduced waste by 30 percent'가 선지에 그대로 반복"}, {"q": "What is the goal for next year?", "choices": ["Hire more staff", "Use renewable energy in all factories", "Open new offices", "Lower prices"], "answer": "Use renewable energy in all factories", "paraphrase_note": "지문의 'initiative to use renewable energy in all factories by next year'가 선지에 그대로 반복"}]}}, "day20": {"theme": "복습 주간 (Day11~19 유형+문법 재시험)", "note": "문법 복습 순서: 전치사(시간)→전치사(장소)→관계대명사→관계부사→to부정사→동명사→분사→분사구문→비교급/최상급. 본책 진도 Day1~20이 완료되는 시점입니다. Day21부터는 실전모의고사(풀기/복습 교대) 구간이 시작됩니다.", "vocab_review": ["complaint", "upgrade", "manufacture", "lease", "conference", "deposit", "shortage", "benefits", "sustainable"], "vocab": []}, "day21": {"type": "풀기 (본책 모의고사 1회 - 축소판)", "timer": {"lc_minutes": 15, "rc_minutes": 20}, "lc": [{"script": "A: Could you send me the updated sales figures?\nB: I'll email them right after this meeting.", "q": "When will B send the figures?", "choices": ["Before the meeting", "Right after the meeting", "Tomorrow", "Next week"], "answer": "Right after the meeting"}, {"script": "A: The printer on the third floor isn't working.\nB: I'll call maintenance to fix it today.", "q": "What will B do?", "choices": ["Buy a new printer", "Call maintenance", "Move to another floor", "Fix it himself"], "answer": "Call maintenance"}, {"script": "A: Did you finish the quarterly report?\nB: Almost, I just need to add the charts.", "q": "What does B still need to do?", "choices": ["Write the summary", "Add the charts", "Print the report", "Email the report"], "answer": "Add the charts"}, {"script": "A: Our flight was delayed by two hours.\nB: Then we'll miss the connecting flight.", "q": "What is the result of the delay?", "choices": ["They will arrive early", "They will miss a connection", "The flight was canceled", "They changed airlines"], "answer": "They will miss a connection"}, {"script": "A: The new hire starts on Monday.\nB: I'll prepare her desk and login access.", "q": "What will B prepare?", "choices": ["A training manual", "Her desk and login access", "A welcome party", "A job offer"], "answer": "Her desk and login access"}, {"script": "A: Can we move the deadline to Friday?\nB: I'll check with the client first.", "q": "What will B do before answering?", "choices": ["Extend it immediately", "Check with the client", "Refuse the request", "Cancel the project"], "answer": "Check with the client"}, {"script": "A: The conference room is booked all afternoon.\nB: Let's use the smaller room on the second floor.", "q": "What does B suggest?", "choices": ["Canceling the meeting", "Using a different room", "Booking earlier", "Meeting online"], "answer": "Using a different room"}, {"script": "A: I can't access the shared drive.\nB: IT is updating the system right now.", "q": "Why can't A access the drive?", "choices": ["It was deleted", "IT is updating the system", "The password changed", "The drive is full"], "answer": "IT is updating the system"}, {"script": "A: Have the samples arrived from the supplier?\nB: Yes, they're in the warehouse now.", "q": "Where are the samples?", "choices": ["Still in transit", "In the warehouse", "At the supplier", "Returned"], "answer": "In the warehouse"}, {"script": "A: We need to renew the software license.\nB: I'll submit the request today.", "q": "What will B submit?", "choices": ["A complaint", "A license renewal request", "A new contract", "A refund request"], "answer": "A license renewal request"}], "part5": [{"sentence": "The manager will ___ the final decision by Friday.", "choices": ["make", "made", "making", "makes"], "answer": "make", "grammar_point": "동사자리: 조동사(will)+동사원형"}, {"sentence": "Employees are required to ___ their ID badges at all times.", "choices": ["wear", "wearing", "worn", "wears"], "answer": "wear", "grammar_point": "to부정사: required to + 동사원형"}, {"sentence": "The proposal was rejected ___ of its high cost.", "choices": ["because", "because of", "although", "despite"], "answer": "because of", "grammar_point": "전치사구: because of + 명사(cost)"}, {"sentence": "She has worked at the firm ___ five years.", "choices": ["for", "since", "during", "while"], "answer": "for", "grammar_point": "전치사(시간): 현재완료+기간 → for"}, {"sentence": "The report ___ by the finance team last week.", "choices": ["completed", "was completed", "completing", "completes"], "answer": "was completed", "grammar_point": "수동태: last week(과거)+by the finance team(행위자) → was+p.p."}], "part6": {"passage": "Dear Team, Please note that the office will be ___(1)___ on Monday for building maintenance. All employees should work from home. If you need ___(2)___ to the building, please contact security in advance. We apologize for ___(3)___ inconvenience.", "blanks": [{"num": 1, "choices": ["close", "closed", "closing", "closes"], "answer": "closed", "grammar_point": "수동태/분사: will be + p.p."}, {"num": 2, "choices": ["access", "accessing", "accessed", "accesses"], "answer": "access", "grammar_point": "명사자리: need + 명사(목적어)"}, {"num": 3, "choices": ["any", "some", "few", "little"], "answer": "any", "grammar_point": "부정문/사과 표현: apologize for any inconvenience (관용표현)"}]}, "part7": {"passage": "Office Memo: Effective next Monday, parking spaces on the ground floor will be reserved for visitors only. Employees should use the parking garage across the street. A shuttle will run every 15 minutes between the garage and the main entrance.", "questions": [{"q": "What is reserved for visitors?", "choices": ["The parking garage", "Ground floor parking", "The main entrance", "The shuttle"], "answer": "Ground floor parking", "paraphrase_note": "지문의 'parking spaces on the ground floor will be reserved for visitors'가 선지의 'Ground floor parking'으로 축약"}, {"q": "How often does the shuttle run?", "choices": ["Every 5 minutes", "Every 15 minutes", "Every 30 minutes", "Every hour"], "answer": "Every 15 minutes", "paraphrase_note": "지문의 'every 15 minutes'가 선지에 그대로 반복 - 숫자 정확히 확인하는 유형"}]}}, "day22": {"type": "복습", "note": "Day21 모의고사 채점 후 복습법 5단계 적용: ① 유형별 분류 ② 오답 해설 정독 ③ (다음날) 재확인 ④ 모르는 문법은 본책 복귀 ⑤ 정리. 앱에서는 이 Day에 Day21에서 틀린 문항만 모아 재풀이하는 '오답 재시험' 화면을 띄우세요."}, "day23": {"type": "풀기 (본책 모의고사 2회 - 축소판)", "timer": {"lc_minutes": 15, "rc_minutes": 20}, "lc": [{"script": "A: The client wants to reschedule tomorrow's call.\nB: What time works better for them?", "q": "What does B ask?", "choices": ["The location", "A better time", "The topic", "The client's name"], "answer": "A better time"}, {"script": "A: I ordered new chairs for the office.\nB: When will they be delivered?", "q": "What does B want to know?", "choices": ["The price", "The delivery date", "The color", "The quantity"], "answer": "The delivery date"}, {"script": "A: Our website crashed during the sale.\nB: IT is restoring it now.", "q": "What is IT doing?", "choices": ["Building a new site", "Restoring the website", "Canceling the sale", "Updating prices"], "answer": "Restoring the website"}, {"script": "A: Did the invoice get approved?\nB: Yes, accounting signed off this morning.", "q": "Who approved the invoice?", "choices": ["Marketing", "Accounting", "Sales", "IT"], "answer": "Accounting"}, {"script": "A: We're short on staff for the event.\nB: I'll ask a few volunteers to help.", "q": "What will B do?", "choices": ["Cancel the event", "Ask volunteers to help", "Hire new staff", "Postpone the event"], "answer": "Ask volunteers to help"}, {"script": "A: The training session ran long today.\nB: We'll finish the rest tomorrow morning.", "q": "When will the training finish?", "choices": ["Today", "Tomorrow morning", "Next week", "It's canceled"], "answer": "Tomorrow morning"}, {"script": "A: Can you review my draft before noon?\nB: I have a meeting, but I'll try.", "q": "Why might B be delayed?", "choices": ["A meeting", "A trip", "A phone call", "A deadline"], "answer": "A meeting"}, {"script": "A: The vendor raised their prices again.\nB: Let's look for a new supplier.", "q": "What does B suggest?", "choices": ["Negotiating the price", "Finding a new supplier", "Canceling the order", "Paying the new price"], "answer": "Finding a new supplier"}, {"script": "A: The elevator is out of service.\nB: We'll need to use the stairs today.", "q": "What must they do?", "choices": ["Wait for repair", "Use the stairs", "Use another building", "Cancel the meeting"], "answer": "Use the stairs"}, {"script": "A: Has the new intern finished the training?\nB: Not yet, she has one more module.", "q": "What does the intern still need?", "choices": ["A laptop", "One more module", "A supervisor", "A desk"], "answer": "One more module"}], "part5": [{"sentence": "The new policy will take effect ___ January 1.", "choices": ["on", "at", "in", "by"], "answer": "on", "grammar_point": "전치사(날짜): 특정 날짜엔 on"}, {"sentence": "The team worked ___ to meet the tight deadline.", "choices": ["hard", "hardly", "harder", "hardest"], "answer": "hard", "grammar_point": "부사자리 함정: hard(열심히, 부사) vs hardly(거의 ~않다) - 의미 구분 필수"}, {"sentence": "___ the rain, the outdoor event continued as planned.", "choices": ["Despite", "Although", "Because", "Since"], "answer": "Despite", "grammar_point": "전치사 vs 접속사: 뒤에 명사(rain)만 있으므로 전치사 Despite"}, {"sentence": "Each applicant must submit a resume ___ two references.", "choices": ["and", "with", "or", "but"], "answer": "with", "grammar_point": "전치사: '~와 함께' → with"}, {"sentence": "The equipment ___ regularly to prevent breakdowns.", "choices": ["is maintained", "maintains", "maintaining", "to maintain"], "answer": "is maintained", "grammar_point": "수동태: 장비는 '유지 관리를 받는' 대상 → is maintained"}], "part6": {"passage": "Dear Customer, Thank you for your recent purchase. Your order has been ___(1)___ and will arrive within 5 business days. If you have any questions, please ___(2)___ our support team. We hope you will be fully ___(3)___ with your purchase.", "blanks": [{"num": 1, "choices": ["ship", "shipped", "shipping", "ships"], "answer": "shipped", "grammar_point": "수동태: has been + p.p."}, {"num": 2, "choices": ["contact", "contacting", "contacted", "contacts"], "answer": "contact", "grammar_point": "명령문: please + 동사원형"}, {"num": 3, "choices": ["satisfy", "satisfied", "satisfying", "satisfaction"], "answer": "satisfied", "grammar_point": "형용사자리: be동사(be)+빈칸 → 감정 형용사(satisfied)"}]}, "part7": {"passage": "Product Recall Notice: Due to a manufacturing defect, all units of Model X250 sold between January and March are being recalled. Customers should stop using the product immediately and contact customer service for a full refund or replacement.", "questions": [{"q": "Why is the product being recalled?", "choices": ["Low sales", "A manufacturing defect", "A price change", "A packaging update"], "answer": "A manufacturing defect", "paraphrase_note": "지문의 'Due to a manufacturing defect'가 선지에 그대로 반복"}, {"q": "What should customers do?", "choices": ["Continue using it", "Contact customer service", "Return it to the factory", "Wait for a new model"], "answer": "Contact customer service", "paraphrase_note": "지문의 'contact customer service for a full refund or replacement'가 선지에 그대로 반복"}]}}, "day24": {"type": "복습", "note": "Day23 모의고사 오답노트 정리. 복습법 5단계 반복 적용."}, "day25": {"type": "풀기 (YBM 실전 1000 스타일 TEST 01 - 축소판)", "timer": {"lc_minutes": 15, "rc_minutes": 20}, "lc": [{"script": "A: The budget proposal needs revisions.\nB: I'll have it ready by tomorrow.", "q": "What does B promise?", "choices": ["A new proposal", "Revisions by tomorrow", "A meeting", "A refund"], "answer": "Revisions by tomorrow"}, {"script": "A: Our top client wants a discount.\nB: Let's offer 10 percent for bulk orders.", "q": "What does B propose?", "choices": ["A full refund", "A 10 percent discount", "Free shipping", "A new contract"], "answer": "A 10 percent discount"}, {"script": "A: The server went down again last night.\nB: We should upgrade our hosting plan.", "q": "What does B suggest?", "choices": ["Firing IT", "Upgrading the hosting plan", "Closing the website", "Hiring more staff"], "answer": "Upgrading the hosting plan"}, {"script": "A: When is the product launch event?\nB: It's set for the second week of October.", "q": "When is the launch event?", "choices": ["First week of October", "Second week of October", "Third week of October", "November"], "answer": "Second week of October"}, {"script": "A: I need approval for the travel expenses.\nB: Send the form to Ms. Park.", "q": "Who should A send the form to?", "choices": ["The client", "Ms. Park", "Accounting", "HR"], "answer": "Ms. Park"}, {"script": "A: The new logo design looks great.\nB: Let's present it to the board next week.", "q": "What will they do next week?", "choices": ["Redesign the logo", "Present it to the board", "Cancel the project", "Print the logo"], "answer": "Present it to the board"}, {"script": "A: Can you cover my shift on Saturday?\nB: Sure, as long as I can leave early.", "q": "What condition does B set?", "choices": ["Getting paid extra", "Leaving early", "Working from home", "Switching shifts"], "answer": "Leaving early"}, {"script": "A: The survey results are in.\nB: What percentage were satisfied?", "q": "What does B ask about?", "choices": ["The sample size", "The satisfaction percentage", "The survey date", "The survey cost"], "answer": "The satisfaction percentage"}, {"script": "A: We're expanding to a new city next year.\nB: Which city are we considering?", "q": "What does B want to know?", "choices": ["The budget", "The city name", "The timeline", "The staff count"], "answer": "The city name"}, {"script": "A: The contract renewal is due next week.\nB: I'll draft the updated terms today.", "q": "What will B do today?", "choices": ["Sign the contract", "Draft updated terms", "Cancel the contract", "Call the client"], "answer": "Draft updated terms"}], "part5": [{"sentence": "The company ___ its headquarters to a larger building last year.", "choices": ["relocate", "relocated", "relocating", "relocates"], "answer": "relocated", "grammar_point": "동사시제: last year(과거표현) → 과거시제"}, {"sentence": "Employees ___ complete the survey by Friday.", "choices": ["must", "should be", "are", "have"], "answer": "must", "grammar_point": "조동사: must+동사원형(complete)"}, {"sentence": "The workshop is designed ___ improve communication skills.", "choices": ["to", "for", "with", "of"], "answer": "to", "grammar_point": "to부정사(목적): '~하기 위해' → to+동사원형"}, {"sentence": "Sales increased ___ than expected this quarter.", "choices": ["more", "most", "much", "many"], "answer": "more", "grammar_point": "비교급: than expected → 비교급 more"}, {"sentence": "The manual explains ___ to operate the new machine.", "choices": ["how", "what", "why", "which"], "answer": "how", "grammar_point": "의문사+to부정사: how to + 동사원형 (방법)"}], "part6": {"passage": "To All Staff: We are pleased to announce a new training program ___(1)___ next month. The program will focus on leadership skills and is open to all employees ___(2)___ have worked here for at least one year. Please register ___(3)___ your supervisor by the end of this week.", "blanks": [{"num": 1, "choices": ["begin", "beginning", "began", "begins"], "answer": "beginning", "grammar_point": "분사: program을 수식하는 현재분사(시작하는)"}, {"num": 2, "choices": ["who", "which", "where", "when"], "answer": "who", "grammar_point": "관계대명사: 선행사(employees, 사람)+주격 → who"}, {"num": 3, "choices": ["with", "at", "on", "in"], "answer": "with", "grammar_point": "전치사(관용표현): register with + 대상"}]}, "part7": {"passage": "Training Announcement: A new leadership training program will begin next month, open to employees with at least one year of experience. Sessions will be held every Wednesday for eight weeks. Interested employees should register with their supervisor by Friday.", "questions": [{"q": "Who can join the program?", "choices": ["All new hires", "Employees with 1+ year of experience", "Only managers", "Only HR staff"], "answer": "Employees with 1+ year of experience", "paraphrase_note": "지문의 'open to employees with at least one year of experience'가 선지의 '1+ year of experience'로 패러프레이징"}, {"q": "How long does the program last?", "choices": ["Four weeks", "Six weeks", "Eight weeks", "Ten weeks"], "answer": "Eight weeks", "paraphrase_note": "지문의 'for eight weeks'가 선지에 그대로 반복"}]}}, "day26": {"type": "복습", "note": "Day25 모의고사 오답노트 정리. 문법 개념이 낯설면 해당 Day 본책으로 복귀."}, "day27": {"type": "풀기 (YBM 실전 1000 스타일 TEST 02 - 축소판)", "timer": {"lc_minutes": 15, "rc_minutes": 20}, "lc": [{"script": "A: Our booth at the trade show needs new banners.\nB: I'll order them this afternoon.", "q": "What will B order?", "choices": ["New chairs", "New banners", "New brochures", "New badges"], "answer": "New banners"}, {"script": "A: The quarterly numbers look strong.\nB: Yes, revenue is up 15 percent.", "q": "How much did revenue increase?", "choices": ["5 percent", "10 percent", "15 percent", "20 percent"], "answer": "15 percent"}, {"script": "A: Can we get an extension on the project?\nB: I'll ask the client, but no promises.", "q": "What will B do?", "choices": ["Grant the extension", "Ask the client", "Refuse the request", "End the project"], "answer": "Ask the client"}, {"script": "A: The copier is out of toner again.\nB: I'll order more supplies today.", "q": "What is the problem?", "choices": ["The copier is broken", "It's out of toner", "It's too slow", "It's being replaced"], "answer": "It's out of toner"}, {"script": "A: The new branch opens next Monday.\nB: Are all the staff hired yet?", "q": "What does B ask?", "choices": ["About the location", "About staffing", "About the budget", "About the opening date"], "answer": "About staffing"}, {"script": "A: I finished the market research report.\nB: Great, can you present it at Thursday's meeting?", "q": "What does B ask A to do?", "choices": ["Rewrite the report", "Present it Thursday", "Email it now", "Cancel the meeting"], "answer": "Present it Thursday"}, {"script": "A: The client canceled their order.\nB: Did they say why?", "q": "What does B want to know?", "choices": ["The order size", "The reason for cancellation", "The delivery date", "The refund amount"], "answer": "The reason for cancellation"}, {"script": "A: We need to update the employee handbook.\nB: HR is already working on it.", "q": "Who is working on the handbook?", "choices": ["Legal", "HR", "Marketing", "IT"], "answer": "HR"}, {"script": "A: The new software rollout starts Monday.\nB: Will there be training sessions?", "q": "What does B ask about?", "choices": ["The cost", "Training sessions", "The rollout date", "Technical support"], "answer": "Training sessions"}, {"script": "A: Our top competitor just lowered their prices.\nB: We should review our pricing strategy.", "q": "What does B suggest?", "choices": ["Ignoring it", "Reviewing pricing strategy", "Raising prices", "Contacting the competitor"], "answer": "Reviewing pricing strategy"}], "part5": [{"sentence": "The document must be signed ___ both parties.", "choices": ["by", "with", "for", "to"], "answer": "by", "grammar_point": "전치사(수동태 행위자): must be signed by"}, {"sentence": "The new hires received ___ training last week.", "choices": ["extensive", "extend", "extension", "extending"], "answer": "extensive", "grammar_point": "형용사자리: , "answer": "Keeping the current rate", "paraphrase_note": "지문의 'to keep your current discounted rate' → 선지의 'Keeping the current rate'로 축약"}]}}, "day28": {"type": "복습", "note": "Day27 모의고사 오답노트 정리."}, "day29": {"type": "풀기 (YBM 실전 1000 스타일 TEST 03 - 최종 모의고사, 축소판)", "timer": {"lc_minutes": 15, "rc_minutes": 20}, "condition_note": "실제 시험 당일과 같은 시간대에 응시하고 컨디션 관리를 시작하는 날입니다.", "lc": [{"script": "A: Is the annual report finalized?\nB: Almost, just waiting on the CFO's signature.", "q": "What is missing from the report?", "choices": ["Sales data", "The CFO's signature", "The cover page", "Charts"], "answer": "The CFO's signature"}, {"script": "A: We're launching in three new countries this year.\nB: Which region is the priority?", "q": "What does B ask?", "choices": ["The budget", "The priority region", "The launch date", "The staff count"], "answer": "The priority region"}, {"script": "A: My laptop keeps freezing during video calls.\nB: Let's get IT to check it today.", "q": "What will happen today?", "choices": ["A new laptop will be bought", "IT will check the laptop", "The calls will be canceled", "A refund will be issued"], "answer": "IT will check the laptop"}, {"script": "A: The client loved our proposal.\nB: That's great, let's schedule the contract signing.", "q": "What is the next step?", "choices": ["Revising the proposal", "Scheduling contract signing", "Ending the deal", "Lowering the price"], "answer": "Scheduling contract signing"}, {"script": "A: We ran out of promotional flyers.\nB: I'll print more before the event.", "q": "What will B do?", "choices": ["Cancel the event", "Print more flyers", "Order banners", "Reschedule"], "answer": "Print more flyers"}, {"script": "A: The audit found a small discrepancy.\nB: Finance is already looking into it.", "q": "Who is investigating the discrepancy?", "choices": ["HR", "Finance", "Legal", "Marketing"], "answer": "Finance"}, {"script": "A: Can we push the product demo to Thursday?\nB: I'll check if the client is → prior to"}], "part6": {"passage": "Dear Employees, As part of our year-end review, all performance evaluations must be ___(1)___ by December 15. Managers should schedule one-on-one meetings with each team member ___(2)___ discuss goals for next year. Please contact HR if you have any ___(3)___ questions.", "blanks": [{"num": 1, "choices": ["complete", "completed", "completing", "completes"], "answer": "completed", "grammar_point": "수동태: must be + p.p."}, {"num": 2, "choices": ["to", "for", "with", "of"], "answer": "to", "grammar_point": "to부정사(목적): meetings...to discuss"}, {"num": 3, "choices": ["additional", "addition", "additionally", "add"], "answer": "additional", "grammar_point": "형용사자리: 빈칸+명사(questions)"}]}, "part7": {"passage": "Year-End Notice: All performance evaluations must be completed by December 15. Managers are required to hold one-on-one meetings with each employee to discuss achievements and set goals for the upcoming year. Completed evaluations should be submitted to HR electronically.", "questions": [{"q": "What is the deadline for evaluations?", "choices": ["November 15", "December 1", "December 15", "January 1"], "answer": "December 15", "paraphrase_note": "지문의 'must be completed by December 15'가 선지에 그대로 반복"}, {"q": "How should evaluations be submitted?", "choices": ["By mail", "In person", "Electronically", "By fax"], "answer": "Electronically", "paraphrase_note": "지문의 'submitted to HR electronically'가 선지에 그대로 반복"}]}}, "day30": {"type": "복습 + 총정리", "note": "새 문제를 풀지 않고 지금까지의 오답노트 전체를 훑으며 자주 틀리는 패턴 3~5개만 골라 마지막까지 기억합니다. 문법 포인트 전체 복습 순서(Day1~19): 명사자리→동사자리→형용사자리→부사자리→시제(단순/완료)→수동태→등위/상관접속사→종속접속사→전치사(시간/장소)→관계대명사→관계부사→to부정사→동명사→분사→분사구문→비교급/최상급. 컨디션 유지가 최우선인 날입니다. 앱에서는 이 Day에 전체 오답노트 통계 화면(유형별·문법포인트별 빈도 Top5)을 자동으로 띄워주면 좋습니다."}};

<script>
(function(){
  "use strict";

  /* ---------------- Text-to-speech ---------------- */
  let ttsWarned = false;
  let ttsUnlocked = false;
  function unlockTTS(){
    // Some mobile browsers need a silent utterance on first user gesture to unlock audio.
    if(ttsUnlocked || !('speechSynthesis' in window)) return;
    try{
      const warm = new SpeechSynthesisUtterance(" ");
      warm.volume = 0;
      window.speechSynthesis.speak(warm);
      ttsUnlocked = true;
    }catch(e){}
  }
  document.addEventListener("touchstart", unlockTTS, {once:true, passive:true});
  document.addEventListener("click", unlockTTS, {once:true});

  function speak(text){
    if(!text) return;
    if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === "undefined"){
      if(!ttsWarned){
        ttsWarned = true;
        alert("이 화면에서는 음성 재생을 지원하지 않아요. 우측 상단 메뉴에서 '브라우저에서 열기'로 Safari/Chrome에서 열어보세요.");
      }
      return;
    }
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.92;
      u.volume = 1;
      let started = false;
      u.onstart = ()=>{ started = true; };
      u.onerror = ()=>{
        if(!ttsWarned){
          ttsWarned = true;
          alert("음성 재생이 차단된 것 같아요. 이 페이지를 Safari나 Chrome 브라우저에서 직접 열어 다시 시도해보세요.");
        }
      };
      window.speechSynthesis.speak(u);
      // Fallback check: if nothing started within 1.2s, warn once.
      setTimeout(()=>{
        if(!started && !ttsWarned && !window.speechSynthesis.speaking){
          ttsWarned = true;
          alert("음성이 재생되지 않았어요. 이 페이지를 Safari나 Chrome 브라우저에서 직접 열어보시면 정상 작동해요.");
        }
      }, 1200);
    }catch(e){
      if(!ttsWarned){
        ttsWarned = true;
        alert("음성 재생 중 오류가 발생했어요. 브라우저에서 직접 열어 다시 시도해주세요.");
      }
    }
  }
  function makeSpeakBtn(text, extraClass){
    const b = document.createElement("button");
    b.className = "speak-btn" + (extraClass ? " "+extraClass : "");
    b.type = "button";
    b.textContent = "🔊";
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      unlockTTS();
      speak(text);
    });
    return b;
  }

  /* ---------------- State / storage ---------------- */
  const LS_KEY = "toeic30_state_v1";
  function loadState(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { startDate:null, completedDays:{}, mistakes:[], vocabKnown:{}, examResults:{} };
  }
  function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  let state = loadState();

  const dayKeys = Object.keys(TOEIC_DATA).sort();
  const totalDays = dayKeys.length;

  function todayIndex(){
    if(!state.startDate) return null;
    const start = new Date(state.startDate + "T00:00:00");
    const now = new Date();
    const diffDays = Math.floor((now - start) / 86400000);
    let idx = diffDays + 1;
    if(idx < 1) idx = 1;
    if(idx > totalDays) idx = totalDays;
    return idx;
  }

  function dayKeyFromNum(n){ return "day" + String(n).padStart(2,"0"); }

  /* ---------------- Header ---------------- */
  function renderHeader(){
    const done = Object.keys(state.completedDays).length;
    document.getElementById("hdrDayCount").innerHTML = (state.startDate ? todayIndex() : "–") + '<span class="of"> / 30</span>';
    document.getElementById("hdrProgress").style.width = Math.round(done/totalDays*100) + "%";
  }

  /* ---------------- Tabs ---------------- */
  const tabs = {};
  let currentTab = "schedule";
  let scheduleDetailDay = null;

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      currentTab = btn.dataset.tab;
      scheduleDetailDay = null;
      render();
    });
  });

  function setActiveNav(){
    document.querySelectorAll(".nav-btn").forEach(b=>{
      b.classList.toggle("active", b.dataset.tab === currentTab);
    });
  }

  function render(){
    setActiveNav();
    renderHeader();
    const app = document.getElementById("app");
    app.innerHTML = "";
    if(currentTab === "schedule") renderSchedule(app);
    else if(currentTab === "exam") renderExamTab(app);
    else if(currentTab === "mistakes") renderMistakes(app);
    else if(currentTab === "vocab") renderVocabTab(app);
  }

  /* ================= SCHEDULE TAB ================= */
  function renderSchedule(app){
    if(!state.startDate){
      const div = document.createElement("div");
      div.className = "start-prompt";
      div.innerHTML = `
        <div class="theme-line" style="margin-bottom:8px;">30일 학습을 시작할까요?</div>
        <p>시작일을 기준으로 Day1부터 Day30까지 자동으로 배정됩니다.</p>
        <button class="btn block" id="startTodayBtn">오늘부터 시작하기</button>
      `;
      app.appendChild(div);
      document.getElementById("startTodayBtn").addEventListener("click", ()=>{
        state.startDate = new Date().toISOString().slice(0,10);
        saveState();
        render();
      });
      const hasData = Object.keys(state.completedDays).length || state.mistakes.length || Object.keys(state.vocabKnown).length || Object.keys(state.examResults).length;
      if(hasData){
        const wipeBtn2 = document.createElement("button");
        wipeBtn2.className = "btn outline red small";
        wipeBtn2.textContent = "전체 학습 초기화";
        wipeBtn2.addEventListener("click", ()=>{
          if(confirm("완료 기록, 오답노트, 단어 학습 상태, 모의고사 결과가 모두 삭제됩니다. 계속할까요?")){
            state = { startDate:null, completedDays:{}, mistakes:[], vocabKnown:{}, examResults:{} };
            saveState();
            render();
          }
        });
        app.appendChild(wipeBtn2);
      }
      return;
    }

    if(scheduleDetailDay){
      renderDayDetail(app, scheduleDetailDay);
      return;
    }

    const h = document.createElement("h2");
    h.className = "section-title";
    h.textContent = "30일 스케줄";
    app.appendChild(h);

    const grid = document.createElement("div");
    grid.className = "day-grid";
    const tIdx = todayIndex();

    dayKeys.forEach((key, i)=>{
      const dayNum = i+1;
      const data = TOEIC_DATA[key];
      const tile = document.createElement("div");
      let cls = "day-tile";
      if(state.completedDays[key]) cls += " done";
      if(dayNum === tIdx) cls += " today";
      if(data.type && data.type.indexOf("복습") === 0) cls += " review";
      if(data.type && data.type.indexOf("풀기") === 0) cls += " exam";
      tile.className = cls;
      let tag = "";
      if(data.theme) tag = data.theme.split(" ")[0].slice(0,4);
      else if(data.type) tag = data.type.split(" ")[0].slice(0,4);
      tile.innerHTML = `<div class="num">${dayNum}</div><div class="tag">${tag}</div>`;
      tile.addEventListener("click", ()=>{
        scheduleDetailDay = key;
        render();
      });
      grid.appendChild(tile);
    });
    app.appendChild(grid);

    const resetBtn = document.createElement("button");
    resetBtn.className = "btn outline small";
    resetBtn.textContent = "시작일 다시 설정";
    resetBtn.addEventListener("click", ()=>{
      if(confirm("시작일을 초기화할까요? 학습 기록은 유지됩니다.")){
        state.startDate = null; saveState(); render();
      }
    });
    app.appendChild(resetBtn);

    const wipeBtn = document.createElement("button");
    wipeBtn.className = "btn outline red small";
    wipeBtn.style.marginLeft = "8px";
    wipeBtn.textContent = "전체 학습 초기화";
    wipeBtn.addEventListener("click", ()=>{
      if(confirm("완료 기록, 오답노트, 단어 학습 상태, 모의고사 결과가 모두 삭제됩니다. 계속할까요?")){
        if(confirm("정말로 초기화할까요? 되돌릴 수 없어요.")){
          state = { startDate:null, completedDays:{}, mistakes:[], vocabKnown:{}, examResults:{} };
          saveState();
          render();
        }
      }
    });
    app.appendChild(wipeBtn);
  }

  function renderDayDetail(app, key){
    const data = TOEIC_DATA[key];
    const dayNum = parseInt(key.replace("day",""),10);

    const back = document.createElement("div");
    back.className = "day-detail-back";
    back.textContent = "‹ 스케줄로 돌아가기";
    back.addEventListener("click", ()=>{ scheduleDetailDay = null; render(); });
    app.appendChild(back);

    const h = document.createElement("h2");
    h.className = "section-title";
    h.textContent = "Day " + dayNum;
    app.appendChild(h);

    const themeBlock = document.createElement("div");
    themeBlock.className = "block";
    themeBlock.innerHTML = `
      <div class="theme-line">${data.theme || data.type || ""}</div>
      ${data.grammar_point ? `<div class="grammar-line">문법 포인트: ${data.grammar_point}</div>` : ""}
      ${data.note ? `<div style="font-size:13px; color:var(--pencil); margin-top:8px; line-height:1.6;">${data.note}</div>` : ""}
      ${data.condition_note ? `<div style="font-size:12.5px; color:var(--red); margin-top:8px;">${data.condition_note}</div>` : ""}
    `;
    app.appendChild(themeBlock);

    // VOCAB
    if(data.vocab && data.vocab.length){
      const div = document.createElement("div");
      div.className = "part-divider";
      div.textContent = "단어 " + data.vocab.length + "개";
      app.appendChild(div);
      const block = document.createElement("div");
      block.className = "block";
      data.vocab.forEach((v, vi)=>{
        const known = !!(state.vocabKnown[key+"_"+vi]);
        const item = document.createElement("div");
        item.className = "vocab-item";
        const head = document.createElement("div");
        head.className = "vocab-head";
        head.innerHTML = `
          <span class="vocab-word">${v.word}</span>
          <span class="vocab-pos">${v.pos||""}</span>
          <span class="vocab-meaning">${v.meaning}</span>
        `;
        head.appendChild(makeSpeakBtn(v.word, "speak-inline"));
        item.appendChild(head);
        if(v.collocation){
          const c = document.createElement("div");

  function renderLC(script, questions, idPrefix){
    const block = document.createElement("div");
    block.className = "block";
    const sWrap = document.createElement("div");
    sWrap.className = "speak-row";
    sWrap.style.alignItems = "flex-start";

    s.className = "q-script";
    s.style.flex = "1";
    s.textContent = script;
    sWrap.appendChild(s);
    sWrap.appendChild(makeSpeakBtn(script));
    block.appendChild(sWrap);
    questions.forEach((q, qi)=>{
      block.appendChild(renderChoiceQuestion({
        sentence: q.q, choices: q.choices, answer: q.answer, isQ:true
      }, idPrefix+"_"+qi, idPrefix, "LC"));
    });
    return block;
  }

  function renderChoiceQuestion(q, qid, dayKey, partLabel){
    const wrap = document.createElement("div");
    wrap.className = "q-block";
    const textEl = document.createElement("div");
    textEl.className = q.isQ ? "q-text" : "q-sentence";
    textEl.textContent = q.sentence;
    wrap.appendChild(textEl);

    const choicesEl = document.createElement("div");
    choicesEl.className = "choices";
    let answered = false;

    q.choices.forEach(choice=>{
      const c = document.createElement("div");
      c.className = "choice";
      c.textContent = choice;
      c.addEventListener("click", ()=>{
        if(answered) return;
        answered = true;
        const isCorrect = choice === q.answer;
        Array.from(choicesEl.children).forEach(ch=>{
          ch.classList.add("disabled");
          if(ch.textContent === q.answer) ch.classList.add("correct");
        });
        if(!isCorrect) c.classList.add("wrong");
        if(q.explain){
          explainEl.classList.add("show");
        }
        if(!isCorrect){
          mistakeBtn.style.display = "inline-block";
        }
      });
      choicesEl.appendChild(c);
    });
    wrap.appendChild(choicesEl);

    const explainEl = document.createElement("div");
    explainEl.className = "q-explain";
    explainEl.textContent = q.explain || "";
    wrap.appendChild(explainEl);

    const mistakeBtn = document.createElement("button");
    mistakeBtn.className = "btn small red save-mistake-btn";
    mistakeBtn.textContent = "오답노트에 저장";
    mistakeBtn.style.display = "none";
    mistakeBtn.addEventListener("click", ()=>{
      openMistakeForm(dayKey, partLabel, q.sentence, q.answer);
    });
    wrap.appendChild(mistakeBtn);

    return wrap;
  }

  /* ================= EXAM (MOCK TEST) TAB ================= */

  let examState = null; // {key, phase, secondsLeft, timerId}

  function renderExamTab(app){
    if(examState && examState.running){
      renderExamRunning(app);
      return;
    }
    const h = document.createElement("h2");
    h.className = "section-title";

    examDays.forEach(key=>{

      const block = document.createElement("div");
      block.className = "block";

      block.innerHTML = `
        <div class="theme-line">Day ${dayNum}</div>
        <div style="font-size:13px; color:var(--pencil); margin:4px 0 10px;">${data.type}</div>

        ${result ? `<div style="font-size:13px; color:var(--green); margin-bottom:10px;">최근 결과: ${result.correct}/${result.total} 정답</div>` : ""}
        <button class="btn block" data-key="${key}">${result ? "다시 응시하기" : "응시 시작"}</button>
      `;
      block.querySelector("button").addEventListener("click", ()=>{
        startExam(key);
      });
