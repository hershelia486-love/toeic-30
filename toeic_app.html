  function startExam(key){
    const data = TOEIC_DATA[key];
    examState = {
      key,
      phase: "lc",
      secondsLeft: data.timer.lc_minutes * 60,
      running: true,
      answers: {},
      currentQ: 0
    };
    tickExam();
    render();
  }

  let examTimerId = null;
  function tickExam(){
    if(examTimerId) clearInterval(examTimerId);
    examTimerId = setInterval(()=>{
      if(!examState || !examState.running) { clearInterval(examTimerId); return; }
      examState.secondsLeft--;
      if(examState.secondsLeft <= 0){
        advanceExamPhase();
      }
      if(currentTab === "exam") updateTimerDisplay();
    }, 1000);
  }

  function advanceExamPhase(){
    const data = TOEIC_DATA[examState.key];
    if(examState.phase === "lc"){
      examState.phase = "rc";
      examState.secondsLeft = data.timer.rc_minutes * 60;
    } else {
      finishExam();
    }
  }

  function finishExam(){
    clearInterval(examTimerId);
    const data = TOEIC_DATA[examState.key];
    let correct = 0, total = 0;
    (data.lc||[]).forEach((q,i)=>{
      total++;
      if(examState.answers["lc"+i] === q.answer) correct++;
    });
    (data.part5||[]).forEach((q,i)=>{
      total++;
      if(examState.answers["p5"+i] === q.answer) correct++;
    });
    if(data.part6){
      data.part6.blanks.forEach((b,i)=>{
        total++;
        if(examState.answers["p6"+i] === b.answer) correct++;
      });
    }
    if(data.part7){
      data.part7.questions.forEach((q,i)=>{
        total++;
        if(examState.answers["p7"+i] === q.answer) correct++;
      });
    }
    state.examResults[examState.key] = {correct, total, date:new Date().toISOString()};
    saveState();
    examState.running = false;
    examState.done = true;
    render();
  }

  function renderExamRunning(app){
    const data = TOEIC_DATA[examState.key];
    if(examState.done){
      const r = state.examResults[examState.key];
      app.innerHTML = `
        <h2 class="section-title">모의고사 결과</h2>
        <div class="block" style="text-align:center;">
          <div class="theme-line">${r.correct} / ${r.total} 정답</div>
          <p style="color:var(--pencil); font-size:13px; margin-top:10px;">채점 후 복습법 5단계를 적용하세요: 유형별 분류 → 오답 해설 정독 → 다음날 재확인 → 문법 복귀 → 정리.</p>
        </div>
        <button class="btn block outline" id="backToExamList">모의고사 목록으로</button>
      `;
      document.getElementById("backToExamList").addEventListener("click", ()=>{
        examState = null; render();
      });
      return;
    }

    const timerDiv = document.createElement("div");
    timerDiv.className = "timer-display";
    timerDiv.innerHTML = `
      <div class="phase">${examState.phase === "lc" ? "LISTENING" : "READING"}</div>
      <div class="time" id="examTimeText"></div>
      <div style="font-size:11px; color:#C7BFA8;">중간에 멈출 수 없습니다. 실제 시험처럼 응시하세요.</div>
    `;
    app.appendChild(timerDiv);
    updateTimerDisplay();

    const questions = buildExamQuestionList(data, examState.phase);
    questions.forEach(item=>{
      const block = document.createElement("div");
      block.className = "block";
      if(item.passage){
        const pWrap = document.createElement("div");
        pWrap.className = "speak-row";
        pWrap.style.alignItems = "flex-start";
        const p = document.createElement("div");
        p.className = "q-passage";
        p.style.flex = "1";
        p.textContent = item.passage;
        pWrap.appendChild(p);
        pWrap.appendChild(makeSpeakBtn(item.passage));
        block.appendChild(pWrap);
      }
      if(item.script){
        const sWrap = document.createElement("div");
        sWrap.className = "speak-row";
        sWrap.style.alignItems = "flex-start";
        const s = document.createElement("div");
        s.className = "q-script";
        s.style.flex = "1";
        s.textContent = item.script;
        sWrap.appendChild(s);
        sWrap.appendChild(makeSpeakBtn(item.script));
        block.appendChild(sWrap);
      }
      const t = document.createElement("div");
      t.className = "q-text";
      t.textContent = item.text;
      block.appendChild(t);
      const choicesEl = document.createElement("div");
      choicesEl.className = "choices";
      item.choices.forEach(choice=>{
        const c = document.createElement("div");
        c.className = "choice";
        if(examState.answers[item.id] === choice) c.classList.add("wrong"); // will re-style below via selection marker
        c.textContent = choice;
        if(examState.answers[item.id] === choice){
          c.style.borderColor = "var(--ochre)";
          c.style.background = "#F3E6CB";
          c.classList.remove("wrong");
        }
        c.addEventListener("click", ()=>{
          examState.answers[item.id] = choice;
          render();
        });
        choicesEl.appendChild(c);
      });
      block.appendChild(choicesEl);
      app.appendChild(block);
    });

    const submitBtn = document.createElement("button");
    submitBtn.className = "btn block";
    submitBtn.textContent = examState.phase === "lc" ? "Listening 제출 → Reading 시작" : "제출하고 채점하기";
    submitBtn.addEventListener("click", ()=>{
      if(confirm("제출하시겠습니까? 제출 후 되돌릴 수 없습니다.")){
        advanceExamPhase();
        render();
      }
    });
    app.appendChild(submitBtn);
  }

  function buildExamQuestionList(data, phase){
    const list = [];
    if(phase === "lc"){
      (data.lc||[]).forEach((q,i)=>{
        list.push({id:"lc"+i, script:q.script, text:q.q, choices:q.choices});
      });
    } else {
      (data.part5||[]).forEach((q,i)=>{
        list.push({id:"p5"+i, text:q.sentence, choices:q.choices});
      });
      if(data.part6){
        data.part6.blanks.forEach((b,i)=>{
          list.push({id:"p6"+i, passage: (i===0?data.part6.passage:null), text:"빈칸 ("+b.num+")", choices:b.choices});
        });
      }
      if(data.part7){
        data.part7.questions.forEach((q,i)=>{
          list.push({id:"p7"+i, passage:(i===0?data.part7.passage:null), text:q.q, choices:q.choices});
        });
      }
    }
    return list;
  }

  function updateTimerDisplay(){
    const el = document.getElementById("examTimeText");
    if(!el || !examState) return;
    const m = Math.floor(examState.secondsLeft/60);
    const s = examState.secondsLeft%60;
    el.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
    el.classList.toggle("warn", examState.secondsLeft <= 60);
  }

  /* ================= MISTAKE NOTEBOOK TAB ================= */
  let mistakeFilter = "all";
  const MISTAKE_TYPES = ["품사자리","시제","수동태","접속사","전치사","관계사","준동사","비교급","어휘","독해시간부족","리스닝놓침","기타"];

  function openMistakeForm(dayKey, part, question, answer){
    const type = prompt("문제 유형을 선택해 입력하세요 (예: 품사자리 / 시제 / 어휘 / 독해시간부족 등):", "기타");
    if(type === null) return;
    const reason = prompt("틀린 이유를 한 줄로 적어주세요:", "");
    if(reason === null) return;
    state.mistakes.push({
      id: Date.now(),
      date: new Date().toISOString().slice(0,10),
      source: dayKey + " · " + part,
      question: question,
      type: type || "기타",
      reason: reason || "",
      answerBasis: answer,
      guessedRight: false
    });
    saveState();
    alert("오답노트에 저장했어요.");
  }

  function renderMistakes(app){
    const h = document.createElement("h2");
    h.className = "section-title";
    h.textContent = "오답노트";
    app.appendChild(h);

    if(!state.mistakes.length){
      app.innerHTML += `<div class="empty-state">아직 저장된 오답이 없어요.<br>문제를 풀다 틀리면 "오답노트에 저장" 버튼으로 여기에 모아보세요.</div>`;
      return;
    }

    // Top types this week-ish (all time, simplified)
    const counts = {};
    state.mistakes.forEach(m=>{ counts[m.type] = (counts[m.type]||0)+1; });
    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const topDiv = document.createElement("div");
    topDiv.className = "top-types";
    topDiv.innerHTML = `<div class="label">가장 많이 틀린 유형 TOP ${sorted.length}</div>` +
      sorted.map(([t,c])=>`<div class="top-type-row"><span>${t}</span><span class="count">${c}회</span></div>`).join("");
    app.appendChild(topDiv);

    const filterRow = document.createElement("div");
    filterRow.className = "filter-row";
    const allTypes = ["all", ...new Set(state.mistakes.map(m=>m.type))];
    allTypes.forEach(t=>{
      const chip = document.createElement("div");
      chip.className = "filter-chip" + (mistakeFilter===t?" active":"");
      chip.textContent = t === "all" ? "전체" : t;
      chip.addEventListener("click", ()=>{ mistakeFilter = t; render(); });
      filterRow.appendChild(chip);
    });
    app.appendChild(filterRow);

    const filtered = mistakeFilter === "all" ? state.mistakes : state.mistakes.filter(m=>m.type===mistakeFilter);
    // group by type
    const groups = {};
    filtered.forEach(m=>{
      groups[m.type] = groups[m.type] || [];
      groups[m.type].push(m);
    });
    Object.entries(groups).forEach(([type, items])=>{
      items.forEach(m=>{
        const card = document.createElement("div");
        card.className = "mistake-card";
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="mistake-type-tag">${m.type}</span>
            <span style="font-size:11px; color:var(--pencil-light); font-family:var(--mono);">${m.date}</span>
          </div>
          <dl class="mistake-grid">
            <dt>출처</dt><dd>${m.source}</dd>
            <dt>문제</dt><dd>${m.question}</dd>
            <dt>틀린 이유</dt><dd>${m.reason || "-"}</dd>
            <dt>정답 근거</dt><dd>${m.answerBasis}</dd>
          </dl>
          <button class="btn small outline" style="margin-top:10px;" data-id="${m.id}">삭제</button>
        `;
        card.querySelector("button").addEventListener("click", ()=>{
          state.mistakes = state.mistakes.filter(x=>x.id !== m.id);
          saveState(); render();
        });
        app.appendChild(card);
      });
    });
  }

  /* ================= VOCAB STUDY TAB ================= */
  let vocabDayFilter = "all";
  let vocabDeck = [];
  let vocabIdx = 0;
  let vocabFlipped = false;
  let vocabOnlyUnknown = false;

  function buildVocabDeck(){
    let items = [];
    dayKeys.forEach(key=>{
      const data = TOEIC_DATA[key];
      if(!data.vocab) return;
      if(vocabDayFilter !== "all" && key !== vocabDayFilter) return;
      data.vocab.forEach((v, vi)=>{
        const id = key+"_"+vi;
        if(vocabOnlyUnknown && state.vocabKnown[id]) return;
        items.push({...v, id, dayKey:key});
      });
    });
    vocabDeck = items;
    if(vocabIdx >= vocabDeck.length) vocabIdx = 0;
  }

  function renderVocabTab(app){
    const h = document.createElement("h2");
    h.className = "section-title";
    h.textContent = "단어 학습";
    app.appendChild(h);

    const daySelect = document.createElement("select");
    daySelect.innerHTML = `<option value="all">전체 Day</option>` +
      dayKeys.filter(k=>TOEIC_DATA[k].vocab && TOEIC_DATA[k].vocab.length).map(k=>{
        const n = parseInt(k.replace("day",""),10);
        return `<option value="${k}" ${vocabDayFilter===k?"selected":""}>Day ${n}</option>`;
      }).join("");
    daySelect.value = vocabDayFilter;
    daySelect.addEventListener("change", ()=>{
      vocabDayFilter = daySelect.value; vocabIdx = 0; vocabFlipped = false; render();
    });
    app.appendChild(daySelect);

    const toggleRow = document.createElement("div");
    toggleRow.style.marginBottom = "12px";
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "btn small " + (vocabOnlyUnknown ? "" : "outline");
    toggleBtn.textContent = vocabOnlyUnknown ? "모르는 단어만 보는 중" : "모르는 단어만 보기";
    toggleBtn.addEventListener("click", ()=>{
      vocabOnlyUnknown = !vocabOnlyUnknown; vocabIdx = 0; vocabFlipped = false; render();
    });
    toggleRow.appendChild(toggleBtn);
    app.appendChild(toggleRow);

    buildVocabDeck();

    if(!vocabDeck.length){
      app.innerHTML += `<div class="empty-state">표시할 단어가 없어요. 필터를 확인해보세요.</div>`;
      return;
    }

    const prog = document.createElement("div");
    prog.className = "fc-progress";
    prog.textContent = (vocabIdx+1) + " / " + vocabDeck.length;
    app.appendChild(prog);

    const v = vocabDeck[vocabIdx];
    const card = document.createElement("div");
    card.className = "flashcard" + (vocabFlipped ? " flipped" : "");
    card.innerHTML = `
      <div class="fc-front">
        <div class="fc-word">${v.word}</div>
        <div class="fc-pos">${v.pos||""}</div>
        <div class="fc-hint">탭해서 뜻 보기</div>
      </div>
      <div class="fc-back">
        <div class="fc-meaning">${v.meaning}</div>
        ${v.collocation ? `<div class="fc-colloc">✎ ${v.collocation}</div>` : ""}
        ${v.memory_tip ? `<div class="fc-tip">💡 ${v.memory_tip}</div>` : ""}
        ${v.example ? `<div class="fc-example">"${v.example}"</div>` : ""}
      </div>
    `;
    card.addEventListener("click", ()=>{ vocabFlipped = !vocabFlipped; render(); });
    app.appendChild(card);

    const speakRow = document.createElement("div");
    speakRow.style.display = "flex";
    speakRow.style.justifyContent = "center";
    speakRow.style.gap = "10px";
    speakRow.style.marginTop = "10px";
    const speakWordBtn = document.createElement("button");
    speakWordBtn.className = "btn outline small";
    speakWordBtn.textContent = "🔊 단어 듣기";
    speakWordBtn.addEventListener("click", (e)=>{ e.stopPropagation(); speak(v.word); });
    speakRow.appendChild(speakWordBtn);
    if(v.example){
      const speakExBtn = document.createElement("button");
      speakExBtn.className = "btn outline small";
      speakExBtn.textContent = "🔊 예문 듣기";
      speakExBtn.addEventListener("click", (e)=>{ e.stopPropagation(); speak(v.example); });
      speakRow.appendChild(speakExBtn);
    }
    app.appendChild(speakRow);

    const controls = document.createElement("div");
    controls.className = "fc-controls";
    controls.innerHTML = `
      <button class="btn outline" id="vocabKnowBtn">안다 ✓</button>
      <button class="btn outline red" id="vocabDontKnowBtn">모른다 ✕</button>
    `;
    app.appendChild(controls);

    document.getElementById("vocabKnowBtn").addEventListener("click", ()=>{
      state.vocabKnown[v.id] = true;
      saveState();
      nextVocab();
    });
    document.getElementById("vocabDontKnowBtn").addEventListener("click", ()=>{
      delete state.vocabKnown[v.id];
      saveState();
      nextVocab();
    });

    const navRow = document.createElement("div");
    navRow.style.display = "flex";
    navRow.style.gap = "10px";
    navRow.style.marginTop = "10px";
    navRow.innerHTML = `<button class="btn outline small" id="vocabPrev" style="flex:1;">이전</button><button class="btn outline small" id="vocabNext" style="flex:1;">다음</button>`;
    app.appendChild(navRow);
    document.getElementById("vocabPrev").addEventListener("click", ()=>{
      vocabIdx = (vocabIdx - 1 + vocabDeck.length) % vocabDeck.length;
      vocabFlipped = false; render();
    });
    document.getElementById("vocabNext").addEventListener("click", nextVocab);
  }

  function nextVocab(){
    vocabIdx = (vocabIdx + 1) % vocabDeck.length;
    vocabFlipped = false;
    render();
  }

  /* ---------------- init ---------------- */
  render();
})();
</script>
</body>
</html>
